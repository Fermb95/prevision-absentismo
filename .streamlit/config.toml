# Configuración de Streamlit. El puerto y la dirección reales los fija el
# Dockerfile con $PORT; aquí, tema y comportamiento del servidor.
[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fa"
textColor = "#111827"
font = "sans serif"
