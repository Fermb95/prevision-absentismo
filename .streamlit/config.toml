# Configuración de Streamlit. El puerto y la dirección reales los fija el
# Dockerfile con $PORT; aquí, tema y comportamiento del servidor.
[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

# Identidad HEFAME: amarillo corporativo #FACD01 + negro sobre blanco.
[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f6f3"
textColor = "#111111"
font = "sans serif"
